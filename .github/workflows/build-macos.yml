name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/macos-*'

permissions:
  contents: read

jobs:
  build:
    name: Build universal app and VST3
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build on Apple Silicon
        run: bash ./build-mac.command
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HertZ-macOS-universal
          path: dist-mac/HertZ-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
